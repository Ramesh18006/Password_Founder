<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login - Security Demo</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="login-box">

        <div class="header">
            Information Security Laboratory Demo
        </div>

        <div class="content">

            <h1>User Login</h1>

            <p class="notice">
                Enter your 3-digit password to continue.
            </p>

            <form id="loginForm">

                <label for="password">Password (3 digits):</label>

                <input type="password" id="password" maxlength="3" pattern="[0-9]{3}" inputmode="numeric"
                    placeholder="•••" autocomplete="off" required>

                <div class="show-password">
                    <input type="checkbox" id="showToggle">
                    <label for="showToggle">Show Password</label>
                </div>

                <div class="buttons">
                    <button type="submit">Login</button>
                    <button type="button" id="clearButton">Clear</button>
                </div>

                <div id="statusMessage"></div>

            </form>

        </div>
    </div>

    <div class="footer">
        Simple Login Security Demo
    </div>

    <script>
        const passwordInput = document.getElementById("password");
        const showToggle = document.getElementById("showToggle");
        const loginForm = document.getElementById("loginForm");
        const clearButton = document.getElementById("clearButton");
        const statusMessage = document.getElementById("statusMessage");

        // Allow only numeric characters
        passwordInput.addEventListener("input", function () {
            passwordInput.value = passwordInput.value.replace(/[^0-9]/g, "");
            clearMessage();
        });

        // Show or hide password
        showToggle.addEventListener("change", function () {
            passwordInput.type = showToggle.checked ? "text" : "password";
        });

        // Send password to Python server
        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const enteredPassword = passwordInput.value;

            if (!/^\d{3}$/.test(enteredPassword)) {
                showMessage("Please enter exactly 3 digits.", "error");
                return;
            }

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        password: enteredPassword
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showMessage("Login Successful!", "success");
                } else {
                    showMessage(result.message, "error");
                }

            } catch (error) {
                showMessage("Unable to connect to the server.", "error");
            }
        });

        // Clear the form
        clearButton.addEventListener("click", function () {
            passwordInput.value = "";
            passwordInput.type = "password";
            showToggle.checked = false;

            clearMessage();
            passwordInput.focus();
        });

        function showMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = type;
        }

        function clearMessage() {
            statusMessage.textContent = "";
            statusMessage.className = "";
        }
    </script>

</body>

</html>
